name: Build and deploy CV to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required files
        run: |
          test -f index.html
          test -f css/style.css
          test -f js/main.js
          test -f js/translations.js
          test -f assets/images/profile-placeholder.svg
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Check for obvious HTML issues
        run: |
          if grep -nE 'src=""|href=""|data-i18n=""|data-i18n-aria-label=""|data-i18n-alt=""' index.html; then
            echo "::error::Found an empty link/resource or an untranslated marker."
            exit 1
          fi
          node --check js/main.js
          node --check js/translations.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
